<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambiar contraseña temporal | AERIQ</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-page"><section class="auth-card"><p class="eyebrow">ACCESO AUTORIZADO</p><h1>Elige tu contraseña</h1><p>Para acceder a tu organización debes sustituir la contraseña temporal.</p><form id="first-password"><label>Contraseña actual<input name="current" type="password" autocomplete="current-password" required></label><label>Nueva contraseña<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><label>Repetir nueva contraseña<input name="confirm" type="password" autocomplete="new-password" minlength="12" required></label><button class="btn btn-primary" type="submit">Guardar y continuar</button></form><button class="text-link" id="first-logout">Cerrar sesión</button><p id="password-feedback" role="status" aria-live="polite"></p></section></main><script src="auth-client.js" defer></script><script src="clave.js" defer></script></body></html>
