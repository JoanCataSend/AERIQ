<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Recupera el acceso a tu cuenta de AERIQ con un código por correo.">
<title>Recuperar contraseña · AERIQ</title>
<link rel="icon" href="assets/aeriq_mark.png">
<link rel="stylesheet" href="aeriq.css">
</head>
<body data-page="login">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
</svg>
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand" aria-label="AERIQ, inicio"><img src="assets/aeriq_logo.png" alt="AERIQ" width="926" height="288"></a>
    <nav class="main-nav" aria-label="Principal"><a href="mapa.html">Mapa</a><a href="sensor.html">El Orb</a><a href="index.html#planes">Organizaciones</a><a href="index.html#nosotros">Nosotros</a><a href="index.html#contacto">Contacto</a></nav>
    <div class="header-actions">
      <a href="login.html" class="link-login" id="account-link">Entrar</a>
      <a href="mapa.html" class="btn btn-primary btn-sm">Ver el mapa</a>
    </div>
    <button class="mobile-toggle" type="button" data-menu-toggle aria-label="Abrir menú"><svg aria-hidden="true"><use href="#i-menu"/></svg></button>
  </div>
</header>
<main class="auth-page">
  <section class="auth-card">
    <h1>Recuperar contraseña</h1>
    <p>Te enviaremos un código por correo. La contraseña nueva no se activa hasta que introduzcas ese código.</p>
    <form id="forgot-form">
      <label>Correo electrónico<input name="email" type="email" required autocomplete="email" placeholder="nombre@organizacion.es"></label>
      <button class="btn btn-primary btn-block" type="submit">Enviar código</button>
    </form>
    <form id="reset-form" hidden>
      <div class="or">Código recibido</div>
      <label>Correo electrónico<input id="reset-email" name="email" type="email" required autocomplete="email" placeholder="nombre@organizacion.es"></label>
      <label>Código de seis cifras<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" required autocomplete="one-time-code" placeholder="123456"></label>
      <label>Contraseña nueva<div class="password-wrap"><input id="reset-password" name="password" type="password" minlength="12" required autocomplete="new-password" placeholder="Mínimo 12 caracteres"><button type="button" class="password-toggle" data-toggle-password="reset-password" aria-label="Mostrar contraseña" aria-pressed="false"><span class="eye-open" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="eye-closed" hidden aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></span></button></div></label>
      <label>Repite la contraseña<div class="password-wrap"><input id="reset-confirm" name="confirm" type="password" minlength="12" required autocomplete="new-password" placeholder="Repite la contraseña"><button type="button" class="password-toggle" data-toggle-password="reset-confirm" aria-label="Mostrar contraseña" aria-pressed="false"><span class="eye-open" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="eye-closed" hidden aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></span></button></div></label>
      <button class="btn btn-primary btn-block" type="submit">Guardar contraseña nueva</button>
    </form>
    <p class="auth-bottom"><a href="login.html">Volver a iniciar sesión</a></p>
  </section>
</main>

<div class="toast" role="status" aria-live="polite" id="toast"></div>
<script src="auth-client.js" defer></script>
<script src="app.js" defer></script>
<script src="precarga-3d.js" defer></script>
</body>
</html>
